name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Engine validation (layouts, generation, determinism, campaign)
        run: npm test
      - name: Build
        run: npm run build
      - name: E2E (headless Edge/Chromium against built app)
        run: node scripts/e2e-ci.mjs
      - name: Upload dist on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-failed
          path: dist/
